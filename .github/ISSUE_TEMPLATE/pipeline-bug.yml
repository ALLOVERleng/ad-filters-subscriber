name: 管线问题
description: 构建、生成、校验或发布环节出错，产物缺失或内容异常
title: "[管线] "
body:
  - type: markdown
    attributes:
      value: |
        跑在 GitHub Actions 上（`Update Filters` / `Verify` / `Release`），失败时先看对应 run 的日志。
        退出码含义：`2` 配置错误、`3` 输入读取失败、`4` 规则处理失败、`5` DNS 校验失败、`6` 产物写出/发布失败。

  - type: dropdown
    id: stage
    attributes:
      label: 出问题的环节
      options:
        - 构建（gradlew build / shadowJar / native）
        - 输入读取（HTTP 拉取、本地文件）
        - 规则处理（解析、去重、转换）
        - 产物校验（发布前语法校验）
        - 发布（清单校验、目录交换、release 分支推送）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 期望什么、实际是什么
      placeholder: release 分支的 dns.txt 停在 11-02，之后每次定时任务都失败
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现方式
      description: 本地命令或 workflow run 链接
      render: text
      placeholder: |
        ./gradlew --no-daemon shadowJar
        java -jar build/libs/adfs-*-all.jar -c config/application.yaml

  - type: textarea
    id: log
    attributes:
      label: 关键日志
      description: 抛错的堆栈或 `ERROR 处理已终止` 附近的行，注意去掉 token 等敏感信息
      render: text

  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: JDK 25.0.1 / Windows 11 / Actions ubuntu-latest
