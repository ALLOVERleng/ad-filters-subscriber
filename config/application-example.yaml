# 示例配置：请先替换输入源，再通过 adfs -c config/application-example.yaml 加载。
# 输入、输出的相对路径均以当前工作目录为基准。
adfs:
  # 名称必须唯一；name、path、type 均为必填字段。
  # 格式：adblock、dns、hosts、dnsmasq、smartdns、mihomo、sing-box。
  input:
    - name: upstream
      path: https://example.org/filter.txt
      type: adblock
      dialect: ubo  # Adblock 方言：core（默认）、abp、adguard、ubo。
      # exclude 是“源级排除”：命中的规则在进入处理管线之前丢弃，用于隔离上游误报，
      # 例如某个列表把公共基础设施整域拦截。支持三种写法：
      #   example.net    —— 该域及其子域
      #   *.example.net  —— 仅子域
      #   adserver       —— 关键词，不区分大小写匹配规则主体
      # 只丢弃阻断/改写类规则，放行（@@）与 IP/CIDR 规则不受影响；误写不会让运行失败。
      # exclude:
      #   - "example.net"
      #   - "*.tracking.example.net"
      #   - "adserver"

    - name: local-hosts
      path: inputs/hosts.txt
      type: hosts

  # 所有输出使用全部输入源；同一格式可输出多个文件，但路径不得重复或冲突。
  # name 为输出目录内的相对文件路径；type 必填。
  # file-header 未填写或为 null 时继承全局模板，非空字符串覆盖，空字符串或纯空白关闭。
  # 模板只填写正文，程序自动逐行添加注释前缀；JSON 不继承模板，显式设置非空模板会报错。
  output:
    - name: easylist.txt
      type: adblock
      dialect: ubo
      # file-header: "自定义标题：{{name}}"
      # exclude 可排除整类规则，目前支持 dns-domain（hosts/dns/mihomo/sing-box 类输入产生的
      # 纯域名阻断）。浏览器列表建议排除：这类规则在浏览器里覆盖不到子域，且会把产物体积推高。
      # exclude: [dns-domain]
      # split 仅适用于 adblock 文本输出：拆成元素规则与 URL 规则两个文件
      # （easylist.txt -> easylist.element.txt + easylist.url.txt），白名单放行只写入 URL 文件。
      # 未声明时 adblock 文本输出默认拆分；显式 split: false 才合并成单文件。
      # split: true

    - name: dns.txt
      type: dns
      dialect: adguard  # DNS 仅支持 adguard，也是默认方言。

    - name: hosts.txt
      type: hosts
      # file-header: ""  # 关闭此输出的文件头。

    - name: dnsmasq.txt
      type: dnsmasq

    - name: smartdns.txt
      type: smartdns

    - name: clash.yaml
      type: mihomo
      dialect: domain  # Mihomo 方言：classical（默认）、domain、ipcidr。
      container: yaml  # Mihomo 支持 yaml（默认）或 text。

    - name: sing-box.json
      type: sing-box
      container: json  # sing-box 仅支持 JSON；其余非 Mihomo 格式仅支持 text。

  # 以下运行选项均可省略，所示数值为默认值。
  config:
    # 输出目录；每轮以整目录原子替换，目录内未声明的旧文件会被清理。父目录必须存在且可写。
    # 生成物与本地输入源应分目录存放（如 output-dir: dist、本地规则放 rules-src/），
    # 否则本地输入文件可能被当作产物一起发布。
    output-dir: dist

    # 默认自动生成文件头；设为 "" 可全局关闭，单文件仍可覆盖。
    # 支持 {{name}}（输出相对路径）、{{type}}、{{dialect}}（无方言时等同于 type）、
    # {{date}}（同次运行共用的带时区生成时间）、{{total}}（最终规则数，含补充白名单）。
    # 未知或不完整变量会报错；旧版 ${...} 模板需改为 {{...}}。
    # 如需相同规则生成相同内容，请从模板中移除 {{date}}。
    file-header: |
      Title: adblock list of {{dialect}}
      Total Size: {{total}}
      Last Modified: {{date}}
      Powered by https://github.com/fordes123/ad-filters-subscriber

    input:
      max-size: 67108864  # 单个输入的大小上限，单位为字节（64 MiB）。
      max-line-length: 262144

    http:
      connect-timeout: 10s
      read-timeout: 30s
      max-redirects: 5
      retries: 2
      user-agent: AdFS/2.0

    rules:
      min-length: 1
      max-length: 65536  # 存在文本输入时，不得超过 input.max-line-length。
      # 域名白名单：覆盖该域及其子域。命中的阻断规则在写出前被减掉，7 种格式结果一致；
      # adblock / dns / smartdns 还会额外补写一条显式放行，便于与本列表之外的规则源共存。
      whitelist: []  # 例如 [www.example.org]。
      # 同一目标既被 @@ 放行又被阻断时，放行优先：保留白名单规则、剔除对应阻断规则。
      # 目标按域名归一（||x^、|x|、0.0.0.0 x、address /x/... 都算同一目标），不做父域覆盖。
      allow-overrides-block: true
      preprocessor:
        max-depth: 32
        max-include-depth: 8
        true-tokens: []  # 输入条件环境的附加真值标记，例如 [env_firefox]；所有输入共享，false 不可配置。

    conversion:
      allow-expansion: false  # 是否允许转换扩大匹配范围。
      allow-reduction: true  # 是否允许转换缩小匹配范围。

    dns:
      enabled: false  # 启用后对可提取确定域名的规则进行 DNS 验证。
      strict-mode: false  # 启用后只检测语义严格为精确域名的规则，关闭时，对形式如 ||example.com^ 的规则也将启用检测
      servers: []  # 留空使用系统 DNS；支持 IP 或 IP:端口，IPv6 使用方括号。
      concurrency: 64
      timeout: 3s
      retries: 1
      max-cname-depth: 16
      cache:
        max-entries: 50000
        max-ttl: 5m
        max-negative-ttl: 1m  # 不得大于 max-ttl。
