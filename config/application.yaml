# 参考 `application-example.yaml` 并在处添加订阅规则，请注意缩进
# Refer to `application-example.yaml` and add subscription rules there，please note the indentation

adfs:

  input:

    # AdGuard 官方过滤器自带 #?# / #$# / #%# 扩展语法, 必须显式声明 adguard 方言。
    # 缺省 core 会让这些规则在 adguard 产物里走「跨方言转换」分支: adguardUboPair(core, adguard)
    # 为 false, 非可移植选择器(如 :has()/:contains())一律被判 Unsupported 丢弃。
    - name: AdGuard 其他恼人广告过滤器
      path: https://filters.adtidy.org/android/filters/21_optimized.txt
      type: adblock
      dialect: adguard

    - name: 晴雅广告拦截规则
      path: https://raw.githubusercontent.com/rssvcn/qy-Ads-Rule/main/black.txt
      type: adblock
      dialect: adguard

    - name: AdGuard Cookie通知过滤器
      path: https://filters.adtidy.org/android/filters/18_optimized.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 弹窗过滤器
      path: https://filters.adtidy.org/android/filters/19_optimized.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 移动拦截程序横幅广告的过滤器
      path: https://filters.adtidy.org/android/filters/20_optimized.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 恼人广告过滤器
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_14_Annoyances/filter.txt
      type: adblock
      dialect: adguard

    - name: Online Malicious URL Blocklist
      path: https://urlhaus-filter.pages.dev/urlhaus-filter-ag-online.txt
      type: adblock

    - name: AdGuard 小工具过滤器
      path: https://filters.adtidy.org/android/filters/22_optimized.txt
      type: adblock
      dialect: adguard

    # 上游仓库已删除(GitHub API 与 raw 均返回 404), 规则集停止维护。
    # 标为可选源, 避免单点 404 让整批产物停更; 内容由下方同作者的合并列表一并提供。
    - name: xndeye web-ad-rule
      path: https://raw.githubusercontent.com/xndeye/web-ad-rule/master/easylist.txt
      type: adblock
      dialect: adguard
      optional: true

    - name: ABP 反广告过滤
      path: https://easylist-downloads.adblockplus.org/abp-filters-anti-cv.txt
      type: adblock
      dialect: adguard

    - name: cjxlist annoyance
      path: https://raw.githubusercontent.com/cjx82630/cjxlist/master/cjx-annoyance.txt
      type: adblock

    - name: xndeye adblock list of easylist
      path: https://raw.githubusercontent.com/xndeye/adblock_list/refs/heads/release/easylist.txt
      type: adblock
      dialect: adguard

    - name: TT拒绝列表
      path: https://raw.githubusercontent.com/A2O-A1/Cat/refs/heads/main/TT%E6%8B%92%E7%BB%9D%E5%88%97%E8%A1%A8%E6%B8%85%E5%8D%95%20(%E6%9B%B4%E6%96%B0%E4%B8%AD).txt
      type: adblock
      dialect: adguard
      # 上游 L224 位于「#通杀规则」区块: /.*bytedance.*/ 是无锚点 URL 正则, 会命中任何
      # 请求 URL 含该词的页面(新闻正文、统计参数皆然), 且 dns/hosts/clash/sing-box 产物
      # 无法表达它, rules.whitelist 也抵消不了(正则目标键为 network:REGEX:...)。
      # exclude 的关键词是子串匹配, 且只丢弃阻断类规则: 本源 @@||rmc.bytedance.com^ 放行保留。
      exclude:
        - "bytedance"

    - name: HyperADRules ads
      path: https://github.com/Lynricsy/HyperADRules/releases/latest/download/hyper_adrules_ads_adguard.txt
      type: adblock

    - name: HyperADRules malware
      path: https://github.com/Lynricsy/HyperADRules/releases/latest/download/hyper_adrules_malware_adguard.txt
      type: adblock

    - name: Telemetry Lists - Aggregated
      path: https://raw.githubusercontent.com/SystemJargon/filters/refs/heads/main/telemetry.txt
      type: adblock
      dialect: adguard

    - name: HyperADRules allow ads
      path: https://github.com/Lynricsy/HyperADRules/releases/latest/download/hyper_adrules_allow_adguard.txt
      type: adblock

    - name: 'xndeye private adblock list'
      path: 'rules-src/private.txt'
      type: adblock
      dialect: adguard

    - name: AdGuard Tracking Protection filter (Optimized)
      path: https://filters.adtidy.org/android/filters/3_optimized.txt
      type: adblock
      dialect: adguard

    # Gitflic 单点源, 上游偶发 404(文件重建中), 置为可选避免整批产物停更。
    - name: Bypass Paywalls Clean filter
      path: https://gitflic.ru/project/magnolia1234/bypass-paywalls-clean-filters/blob/raw?file=bpc-paywall-filter.txt
      type: adblock
      optional: true

    # 该源是 uBO 风格衍生列表(##+js 5041 条、:style( 1003 条), AdGuard 专有语法仅 60 条);
    # 声明 ubo 后 core 下被判非法丢弃的 $xhr(114)/选项别名(292)/domain 通配(26) 也会恢复。
    # 已核对: 全文无严格形态的裸域名规则(0 条), 因此不会触发「裸域名改判为域锚」的语义变更。
    - name: DD-AD
      path: https://raw.githubusercontent.com/afwfv/DD-AD/refs/heads/release/easylist.txt
      type: adblock
      dialect: ubo

    - name: 去广告规则，酷安反馈反馈
      path: https://raw.githubusercontent.com/qq5460168/666/refs/heads/master/rules.txt
      type: adblock
      dialect: adguard

    - name: AdRules 橘猫
      path: https://adrules.5iclub.us.kg/adblock.txt
      type: adblock

    - name: NEO DEV HOST
      path: https://raw.githubusercontent.com/neodevpro/neodevhost/master/adblocker
      type: adblock

    - name: jiekouAD
      path: https://raw.githubusercontent.com/damengzhu/banad/main/jiekouAD.txt
      type: adblock
      dialect: adguard

    - name: DNS-Kuner
      path: https://raw.githubusercontent.com/Kuner-mw/DNS-Kuner/main/FilterRules/blacklist.txt
      type: adblock
      # 本源是「按厂商名整段通杀」的星号通配列表, L38 `*bytedance*` 会命中任何 URL 含该词
      # 的请求(与已从 TT拒绝列表 剔除的 /.*bytedance.*/ 等价)。该通配只进 adblock 的 url
      # 分片, 不进入域名类产物; 关键词在本源内只命中这一条, 其余字节段通配保持原样。
      exclude:
        - "bytedance"

    - name: DNS-Kuner Allow
      path: https://raw.githubusercontent.com/Kuner-mw/DNS-Kuner/main/FilterRules/allowlist.txt
      type: adblock

    - name: JiuYue_Rules
      path: https://rules.vlo.cc/dns/dns.txt
      type: adblock

    - name: '1Hosts Lite'
      path: 'https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/adblock.txt'
      type: adblock
      dialect: core
      # 该源把 GitHub 加速网关当作垃圾域名整域拦截(||gh-proxy.com^ / ||gh-proxy.org^,
      # 位于 Lite/adblock.txt 第 36630-36631 行, 与随机垃圾域名 .online/.store 混在同一批导入),
      # 属于上游误报: 在源级丢弃, 避免污染所有格式的产物。
      exclude:
        - "gh-proxy.com"
        - "gh-proxy.org"

    - name: HaGeZi's Pro DNS Blocklist
      path: https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/pro.txt
      type: adblock

    - name: 去广告规则，反馈🐧群请点击主页
      path: https://raw.githubusercontent.com/qq5460168/dangchu/main/black.txt
      type: adblock

    - name: SM广告丟那吗hosts
      path: https://raw.githubusercontent.com/2Gardon/SM-Ad-FuckU-hosts/refs/heads/master/SMAdHosts
      type: hosts

    - name: 浮风拦截规则
      path: https://raw.githubusercontent.com/Thelongdarkorg/ad-rules-merged/main/merged.txt
      type: adblock
      dialect: adguard

    - name: AdguardFilter标准
      path: https://raw.githubusercontent.com/miaoermua/AdguardFilter/main/rule.txt
      type: adblock

    - name: AdguardFilter黑名单
      path: https://raw.githubusercontent.com/miaoermua/AdguardFilter/main/bad_apple.txt
      type: adblock

    - name: AdguardFilter白名单
      path: https://raw.githubusercontent.com/miaoermua/AdguardFilter/main/whitelist.txt
      type: adblock

    - name: liu50341759
      path: https://github.com/liu50341759/killad/raw/refs/heads/main/rule/all.txt
      type: adblock
      dialect: adguard

  output:
    # 浏览器列表只保留浏览器语义的规则: hosts/dns/mihomo/sing-box 类输入产生的纯域名阻断
    # 在这里既无法覆盖子域、也把文件撑到超出 jsDelivr 的 20MB 上限, 因此统一排除。
    # split: 元素规则与 URL 规则分成两个文件(adblock 文本输出默认开启), 订阅方可以只取其中一类;
    # 同时 @@ 放行只写入 URL 规则文件, 元素文件保持纯 cosmetic。
    - name: easylist.txt
      type: adblock
      dialect: adguard
      exclude: [dns-domain]
      split: true

    - name: ubo.txt
      type: adblock
      dialect: ubo
      exclude: [dns-domain]
      split: true

    - name: abp.txt
      type: adblock
      dialect: abp
      exclude: [dns-domain]
      split: true

    - name: dns.txt
      type: dns
      dialect: adguard

    - name: hosts.txt
      type: hosts

    - name: dnsmasq.txt
      type: dnsmasq

    # 星号通配: 每行 `*.domain` 覆盖该域名的全部子域, 精确主机写成裸域名行。
    # `*` 不匹配根域名本身, 根域拦截请配合 dns.txt / hosts.txt 使用。
    - name: wildcard.txt
      type: wildcard

    - name: smartdns.txt
      type: smartdns

    - name: clash.yaml
      type: mihomo
      dialect: domain
      container: yaml

    - name: sing-box.json
      type: sing-box
      container: json

    # Quantumult X 分流: 每行 `类型, 匹配值, reject`, 类型为 host / host-suffix / host-keyword。
    # 分流规则没有「放行」语义(direct 会把流量摘出代理), @@ 放行与站点作用域规则在转换阶段丢弃。
    - name: quantumult-x.conf
      type: quantumult-x


  config:
    file_header: |
      Title: great adblock list of {{type}}
      Total Size: {{total}}
      Last Modified: {{date}}
      Homepage: https://github.com/ALLOVERleng/ad-filters-subscriber
      Powered by: https://github.com/fordes123/ad-filters-subscriber


    rules:
      min-length: 1
      max-length: 65536  # 存在文本输入时，不得超过 input.max-line-length。
      # 同一域名同时出现在黑名单与白名单时，保留白名单、剔除阻断规则（默认已开启，此处显式声明）。
      allow-overrides-block: true
      whitelist:
        - "edge.microsoft.com"
        - "public.gensparkspace.com"
        - "assets.msn.com"
        # 华为应用商店相关域名
        - "store-drcn.hispace.dbankcloud.com"
        # GitHub 加速网关: 除 1Hosts 外, 任何上游若再次收录也在写出前减掉,
        # 否则 hosts / clash / sing-box 这类无法表达 allow 的产物会把域名指向 0.0.0.0。
        - "gh-proxy.com"
        - "gh-proxy.org"
        # GitHub 静态资源域: 上游 hosts 列表(SM广告丟那吗hosts L35 等)把它映射到
        # 185.199.110.154(GitHub Pages 段), 导致 github.githubassets.com/assets/*.css
        # 与 JS chunk 全部取不到, GitHub 页面退化为无样式纯文本。
        # 该地址映射规则会进入 hosts/dns/dnsmasq/smartdns 四类产物, 白名单在此统一剔除。
        - "github.githubassets.com"
        # 同一批 hosts 规则还把 raw 下载域硬编码到 146.75.48.133, 会破坏订阅与原始文件下载。
        - "raw.githubusercontent.com"

    conversion:
      # 精确主机(dns 语法的 |domain|)没有等价写法, 只能扩展为“域名+子域”;
      # 打开 expansion 以保留这些域名, 否则它们会因语义扩大而被丢弃。
      allow-expansion: true
      allow-reduction: true

    dns:
      enabled: false
      strict-mode: false
      servers:
        - 8.8.8.8:53
        - 8.8.4.4:53
        - 1.1.1.1:53
        - 1.0.0.1:53
        - 9.9.9.9:53
      concurrency: 128
      timeout: 3s
      retries: 1
      max-cname-depth: 16
      cache:
        max-entries: 50000
        max-ttl: 2m
        max-negative-ttl: 1m
