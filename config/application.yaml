    - name: easylist.txt
      type: adblock
      dialect: adguard

    - name: ubo.txt
      type: adblock
      dialect: ubo

    - name: abp.txt
      type: adblock
      dialect: abp

    - name: dns.txt
      type: dns
      dialect: adguard

    - name: hosts.txt
      type: hosts

    - name: dnsmasq.txt
      type: dnsmasq

    - name: smartdns.txt
      type: smartdns

    - name: clash.yaml
      type: mihomo
      dialect: domain
      container: yaml

    - name: sing-box.json
      type: sing-box
      container: json


  config:
    file_header: |
      Title: great adblock list of {{type}}
      Total Size: {{total}}
      Last Modified: {{date}}
      Homepage: https://github.com/ALLOVERleng/ad-filters-subscriber
      Powered by: https://github.com/fordes123/ad-filters-subscriber


    rules:
      min-length: 1
      max-length: 65536  # 存在文本输入时，不得超过 input.max-line-length。
      whitelist:
        - "edge.microsoft.com"
        - "public.gensparkspace.com"
        - "assets.msn.com"
        # 华为应用商店相关域名
        - "store-drcn.hispace.dbankcloud.com"

    conversion:
      allow-expansion: false
      allow-reduction: true

    dns:
      enabled: false
      strict-mode: false
      servers:
        - 8.8.8.8:53
        - 8.8.4.4:53
        - 1.1.1.1:53
        - 1.0.0.1:53
        - 9.9.9.9:53
      concurrency: 128
      timeout: 3s
      retries: 1
      max-cname-depth: 16
      cache:
        max-entries: 50000
        max-ttl: 2m
        max-negative-ttl: 1m
